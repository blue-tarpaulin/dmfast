[package]
name = "dmfast-base"
version.workspace = true
edition = "2024"

[features]
# `validate`: feature list checks for the using crate's tests.
validate = []

[dependencies]
memchr = "2"
rustc-hash = "2.1.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_SystemServices", "Win32_System_Threading", "Win32_System_Diagnostics_Debug"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
# Bundles mimalloc 3.3.2; Windows builds 3.5.4 (vendor/mimalloc-x86/build.bat).
# TODO: move Linux to 3.5.4 once a libmimalloc-sys release bundles it.
libmimalloc-sys = { version = "0.1.49", features = ["extended"] }
