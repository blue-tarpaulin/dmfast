[package]
name = "dmfast-patches"
version.workspace = true
edition = "2024"

[dependencies]
dmfast-base = { path = "../base" }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Console", "Win32_System_Threading"] }
