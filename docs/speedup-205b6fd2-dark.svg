  <text x="205.4" y="289" font-size="12" fill="#e6edf3"><tspan font-weight="600">dmfast 0.85 s</tspan> <tspan fill="#2E46D5" font-weight="700">2.1x faster</tspan></text>
  <text x="0" y="326" font-size="11" fill="#9198a1">dmfast 4.4.0 vs BYOND 516.1688</text>
