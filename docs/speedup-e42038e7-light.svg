  <text x="0" y="180" font-size="15" font-weight="600" fill="#1f2328">DreamDaemon world load <tspan font-weight="400" fill="#59636e" font-size="13">until world/New</tspan></text>
  <text x="0" y="220.0" font-size="13" fill="#1f2328">Windows</text>
