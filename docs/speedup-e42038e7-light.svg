  <text x="150.5" y="289" font-size="12" fill="#1f2328"><tspan font-weight="600">dmfast 0.42 s</tspan> <tspan fill="#2E46D5" font-weight="700">4.2x faster</tspan></text>
  <text x="0" y="326" font-size="11" fill="#59636e">dmfast 4.8.0 vs BYOND 516.1688 (Paradise on 516.1673), four SS13 codebases</text>
