  <text x="576.0" y="109" font-size="12" fill="#9198a1">stock 40.2 s</text>
  <rect x="92" y="120" width="47.0" height="18" rx="3" fill="#2E46D5"/>
  <text x="145.0" y="133" font-size="12" fill="#e6edf3"><tspan font-weight="600">dmfast 3.95 s</tspan> <tspan fill="#7C8EF5" font-weight="700">10.2x faster</tspan></text>
  <text x="0" y="180" font-size="15" font-weight="600" fill="#e6edf3">DreamDaemon world load <tspan font-weight="400" fill="#9198a1" font-size="13">until world/New</tspan></text>
  <text x="0" y="220.0" font-size="13" fill="#e6edf3">Windows</text>
  <rect x="92" y="194" width="478.0" height="18" rx="3" fill="#3d444d"/>
  <text x="576.0" y="207" font-size="12" fill="#9198a1">stock 3.78 s</text>
  <rect x="92" y="218" width="70.8" height="18" rx="3" fill="#2E46D5"/>
  <text x="168.8" y="231" font-size="12" fill="#e6edf3"><tspan font-weight="600">dmfast 0.56 s</tspan> <tspan fill="#7C8EF5" font-weight="700">6.7x faster</tspan></text>
  <text x="0" y="278.0" font-size="13" fill="#e6edf3">Linux</text>
  <rect x="92" y="252" width="216.2" height="18" rx="3" fill="#3d444d"/>
