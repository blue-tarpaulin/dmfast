<svg xmlns="http://www.w3.org/2000/svg" width="720" height="334" viewBox="0 0 720 334" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" role="img" aria-label="dmfast speedups on SS13 codebases: compile 6.6x faster on Windows and 10.2x on Linux; DreamDaemon world load 6.7x and 2.4x faster">
