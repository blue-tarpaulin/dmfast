  <rect x="92" y="276" width="88.5" height="18" rx="3" fill="#2E46D5"/>
  <text x="186.5" y="289" font-size="12" fill="#e6edf3"><tspan font-weight="600">dmfast 0.70 s</tspan> <tspan fill="#7C8EF5" font-weight="700">2.4x faster</tspan></text>
  <text x="0" y="326" font-size="11" fill="#9198a1">dmfast 4.6.0 vs BYOND 516.1688, average of multiple codebases</text>
