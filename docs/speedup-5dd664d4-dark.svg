  <text x="0" y="64.0" font-size="13" fill="#e6edf3">Windows</text>
  <rect x="92" y="38" width="324.9" height="18" rx="3" fill="#3d444d"/>
  <text x="422.9" y="51" font-size="12" fill="#9198a1">stock 27.3 s</text>
  <rect x="92" y="62" width="49.2" height="18" rx="3" fill="#2E46D5"/>
  <text x="147.2" y="75" font-size="12" fill="#e6edf3"><tspan font-weight="600">dmfast 4.14 s</tspan> <tspan fill="#7C8EF5" font-weight="700">6.6x faster</tspan></text>
