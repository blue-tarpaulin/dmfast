name: "Install Rust (Linux container)"
description: "Stable Rust with the i686 target, cached per month so most runs skip the rustup download"

inputs:
  components:
    description: "Extra rustup components, comma-separated (e.g. clippy)"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    # The cache key can't contain commas: components go in as `clippy-rustfmt`.
    - id: key
      shell: bash
      env:
        COMPONENTS: ${{ inputs.components }}
      run: |
        echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
        echo "components=${COMPONENTS//,/-}" >> "$GITHUB_OUTPUT"
    # ~/.rustup holds the toolchain; rustup itself (in ~/.cargo/bin) is cached too, so later steps
    # (Swatinem/rust-cache runs `rustup toolchain list`) find it on a cache hit.
    - id: cache
      uses: actions/cache@v6
      with:
        path: |
          ~/.rustup
          ~/.cargo/bin/rustup
        key: rustup-debian12-i686-${{ steps.key.outputs.components }}-${{ steps.key.outputs.month }}-v2
    - if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        COMPONENTS: ${{ inputs.components }}
      run: curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --target i686-unknown-linux-gnu ${COMPONENTS:+--component "$COMPONENTS"}
    # The toolchain's own bin for cargo and rustc (rustup's proxies in ~/.cargo/bin aren't cached), and
    # ~/.cargo/bin for rustup.
    - shell: bash
      run: |
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
        echo "$HOME/.rustup/toolchains/stable-x86_64-unknown-linux-gnu/bin" >> "$GITHUB_PATH"
