name: "Install Rust (Linux container)"
description: "Stable Rust with the i686 target, cached per month so most runs skip the rustup download"

inputs:
  components:
    description: "Extra rustup components, comma-separated (e.g. clippy)"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - id: month
      shell: bash
      run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
    - id: cache
      uses: actions/cache@v6
      with:
        path: ~/.rustup
        key: rustup-debian12-i686-${{ inputs.components }}-${{ steps.month.outputs.month }}
    - if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        COMPONENTS: ${{ inputs.components }}
      run: curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --target i686-unknown-linux-gnu ${COMPONENTS:+--component "$COMPONENTS"}
    # The toolchain's own bin, not rustup's proxies in ~/.cargo/bin, which aren't cached.
    - shell: bash
      run: echo "$HOME/.rustup/toolchains/stable-x86_64-unknown-linux-gnu/bin" >> "$GITHUB_PATH"
