# Build, pack, scan and test the installer.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# Tag runs (release.yml) are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  CARGO_TERM_COLOR: never

jobs:
  windows:
    name: Build (Windows)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/patches
        with:
          key: ${{ secrets.DMFAST_PATCHES_KEY }}
      - name: Add Rust target
        shell: bash
        run: rustup component add clippy && rustup target add i686-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (dmfast.dll)
        shell: bash
        run: cargo clippy --release --locked -p dmfast --target i686-pc-windows-msvc -- -D warnings
      - name: Tests (dmfast.dll)
        shell: bash
        run: cargo test --release --locked -p dmfast --lib --target i686-pc-windows-msvc
      - name: Clippy (installer, packer)
        shell: bash
        run: cargo clippy --release --locked -p dmfast-install -p dmfast-pack -- -D warnings
      - name: Build installer
        shell: bash
        run: cargo build --release --locked -p dmfast-install
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: target/release/dmfast-install.exe
          if-no-files-found: error

  linux:
    name: Build (Linux)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # Debian 12: glibc 2.34, BYOND 516's minimum.
    container: debian:12
    steps:
      - name: Install build tools
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends git openssh-client ca-certificates curl build-essential gcc-multilib
      - uses: actions/checkout@v7
      - uses: ./.github/actions/patches
        with:
          key: ${{ secrets.DMFAST_PATCHES_KEY }}
      - uses: ./.github/actions/rust-linux
        with:
          components: clippy,rustfmt
      - name: Format
        shell: bash
        run: cargo fmt --all --check
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (libdmfast.so)
        shell: bash
        run: cargo clippy --release --locked -p dmfast --target i686-unknown-linux-gnu -- -D warnings
      - name: Clippy (installer, packer)
        shell: bash
        run: cargo clippy --release --locked -p dmfast-install -p dmfast-pack -- -D warnings
      - name: Build installer
        shell: bash
        run: |
          cargo build --release --locked -p dmfast-install
          cp target/release/dmfast-install dmfast-install-linux
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: dmfast-install-linux
          if-no-files-found: error

  pack:
    name: Pack installer
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/patches
        with:
          key: ${{ secrets.DMFAST_PATCHES_KEY }}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v8 # all of this run's artifacts so far: windows and linux
        with:
          path: parts
      - name: Pack
        run: |
          mkdir -p dist
          cargo run -q --release --locked -p dmfast-pack -- parts/windows/dmfast-install.exe parts/linux/dmfast-install-linux dist/dmfast-install.exe
          sha256sum dist/dmfast-install.exe
      - uses: actions/upload-artifact@v7
        with:
          name: dmfast-install
          path: dist/dmfast-install.exe
          if-no-files-found: error

  # False positives: submit at https://www.microsoft.com/wdsi/filesubmission.
  scan:
    name: Defender scan
    needs: pack
    runs-on: windows-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dmfast-install
      - name: Scan with Windows Defender
        id: scan
        shell: pwsh
        run: |
          $mp = "C:\Program Files\Windows Defender\MpCmdRun.exe"
          & $mp -SignatureUpdate | Out-Null
          $exe = (Resolve-Path dmfast-install.exe).Path
          $out = & $mp -Scan -ScanType 3 -File $exe -DisableRemediation 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $out
          $out | Out-File -FilePath defender_output.txt -Encoding utf8
          # MpCmdRun: 0 = clean, 2 = threat found, anything else = the scan itself failed.
          if ($code -eq 2) {
            Write-Host "::error::Windows Defender flagged dmfast-install.exe"
            "detection=true" >> $env:GITHUB_OUTPUT
            exit 1
          } elseif ($code -ne 0) {
            Write-Host "::error::Windows Defender scan failed (exit code $code)"
            exit 1
          }
      - name: Open an issue for the detection
        if: failure() && steps.scan.outputs.detection == 'true' && github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Windows Defender flagged dmfast-install.exe (${GITHUB_REF_NAME})" \
            --body "$(printf 'Windows Defender flagged the installer built by %s (ref `%s`, sha256 `%s`).\n\nSubmit it as a false positive (software developer) at https://www.microsoft.com/wdsi/filesubmission; it is attached to the run as the `dmfast-install` artifact.\n\n```\n%s\n```\n' "$RUN_URL" "$GITHUB_REF_NAME" "$(sha256sum dmfast-install.exe | cut -d' ' -f1)" "$(cat defender_output.txt)")"

  compat:
    name: Compat ${{ matrix.byond }} (${{ matrix.os == 'windows-latest' && 'Windows' || 'Linux' }})
    needs: pack
    # Fork PRs can't build (no patches key), so they test with the installer from main's latest passing run.
    if: always() && (needs.pack.result == 'success' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository))
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        # No 516.1670: its isinf()/isnan() bug crashes stock.
        byond: ["515.1647", "516.1648", "516.1667", "516.1675", "516.1680", "516.1684", "516.1688", "516.latest"]
    runs-on: ${{ matrix.os }}
    env:
      TG_COMMIT: 1568dbe1daeba67dc20939c6307d07522967e89c
      COMPAT_WORK: ${{ github.workspace }}/compat-work
    steps:
      - uses: actions/checkout@v7
      - name: Fetch the DM test suite
        shell: bash
        run: git submodule update --init --depth 1 tests/dm-test-suite
      - uses: actions/download-artifact@v8
        if: needs.pack.result == 'success'
        with:
          name: dmfast-install
      - name: Installer from main's latest passing run (fork PR)
        if: needs.pack.result != 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh run list -R "$GITHUB_REPOSITORY" -w CI -b main -e push -s success -L 1 --json databaseId -q '.[0].databaseId')
          echo "::notice::Fork PR: testing with the installer from main's run $id"
          gh run download "$id" -R "$GITHUB_REPOSITORY" -n dmfast-install
      # gcc-multilib: tests/fixes/profcpu-gen.sh builds a 32-bit helper library.
      - name: Install 32-bit runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo apt-get install -y -qq libc6:i386 libstdc++6:i386 libgcc-s1:i386 zlib1g:i386 libssl-dev:i386 libcurl4:i386 unzip gcc-multilib
      - uses: actions/cache@v6
        id: tg
        with:
          path: tgstation
          key: tgstation-${{ env.TG_COMMIT }}
      - name: Fetch tgstation
        if: steps.tg.outputs.cache-hit != 'true'
        shell: bash
        run: |
          git init -q tgstation
          git -C tgstation fetch -q --depth 1 https://github.com/tgstation/tgstation.git "$TG_COMMIT"
          git -C tgstation checkout -q FETCH_HEAD
          rm -rf tgstation/.git
      # tgstation ships rust_g.dll but not librust_g.so.
      - name: rust_g version
        id: rustg
        if: runner.os == 'Linux'
        run: echo "version=$(sed -n 's/^export RUST_G_VERSION=//p' tgstation/dependencies.sh)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: rustg-cache
        if: runner.os == 'Linux'
        with:
          path: rust_g
          key: rust_g-${{ steps.rustg.outputs.version }}
      - name: Fetch rust_g
        if: runner.os == 'Linux'
        run: |
          if [ "${{ steps.rustg-cache.outputs.cache-hit }}" != true ]; then
            mkdir -p rust_g
            curl -sSfL --retry 4 -o rust_g/librust_g.so \
              "https://github.com/tgstation/rust-g/releases/download/${{ steps.rustg.outputs.version }}/librust_g.so"
          fi
          cp rust_g/librust_g.so tgstation/librust_g.so
          ldd tgstation/librust_g.so | grep 'not found' && exit 1 || true
      - name: DM test suite commit
        id: suite
        shell: bash
        run: echo "sha=$(git -C tests/dm-test-suite rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Stock verdicts of the DM test suite (cache)
        uses: actions/cache@v6
        with:
          path: suite-cache
          # v2: verdicts from before savefile tests ran one at a time may hold a collision in BYOND's cache.
          key: suite-v2-${{ runner.os }}-${{ matrix.byond }}-${{ steps.suite.outputs.sha }}
      # One compat.py phase per step; a timed-out phase loses only its own column.
      - name: Install BYOND ${{ matrix.byond }} and dmfast
        shell: bash
        run: COMPAT_PHASE=setup python3 tools/compat.py "${{ matrix.byond }}" dmfast-install.exe tgstation/tgstation.dme
      - name: Compile tgstation
        shell: bash
        run: COMPAT_PHASE=project timeout 10m python3 tools/compat.py "${{ matrix.byond }}" dmfast-install.exe tgstation/tgstation.dme || { rc=$?; [ $rc = 124 ] && { touch compat-work/timeout-project; exit 0; }; exit $rc; }
      - name: Verify mode
        shell: bash
        run: COMPAT_PHASE=verify timeout 10m python3 tools/compat.py "${{ matrix.byond }}" dmfast-install.exe tgstation/tgstation.dme || { rc=$?; [ $rc = 124 ] && { touch compat-work/timeout-verify; exit 0; }; exit $rc; }
      - name: World load time
        shell: bash
        run: COMPAT_PHASE=load timeout 10m python3 tools/compat.py "${{ matrix.byond }}" dmfast-install.exe tgstation/tgstation.dme || { rc=$?; [ $rc = 124 ] && { touch compat-work/timeout-load; exit 0; }; exit $rc; }
      - name: World output
        shell: bash
        run: COMPAT_PHASE=world timeout 10m python3 tools/compat.py "${{ matrix.byond }}" dmfast-install.exe tgstation/tgstation.dme || { rc=$?; [ $rc = 124 ] && { touch compat-work/timeout-world; exit 0; }; exit $rc; }
      - name: Bug fix tests
        shell: bash
        run: COMPAT_PHASE=fixes timeout 10m python3 tools/compat.py "${{ matrix.byond }}" dmfast-install.exe tgstation/tgstation.dme || { rc=$?; [ $rc = 124 ] && { touch compat-work/timeout-fixes; exit 0; }; exit $rc; }
      - name: DM test suite
        shell: bash
        run: COMPAT_PHASE=suite COMPAT_SUITE_CACHE="${{ github.workspace }}/suite-cache" timeout 15m python3 tools/compat.py "${{ matrix.byond }}" dmfast-install.exe tgstation/tgstation.dme || { rc=$?; [ $rc = 124 ] && { touch compat-work/timeout-suite; exit 0; }; exit $rc; }
      - name: Report
        if: always()
        shell: bash
        run: COMPAT_PHASE=report python3 tools/compat.py "${{ matrix.byond }}" dmfast-install.exe tgstation/tgstation.dme
      - name: Keep rust_g out of the tgstation cache
        if: always() && runner.os == 'Linux'
        run: rm -f tgstation/librust_g.so
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: compat-${{ runner.os }}-${{ matrix.byond }}
          path: compat-*.md
          if-no-files-found: ignore

  compat-summary:
    name: Compat summary
    needs: compat
    if: always() && needs.compat.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: compat-*
          merge-multiple: true
      - name: Summary
        run: |
          {
            echo "### BYOND compatibility"
            echo
            echo "| Requested | Build | OS | Result | tgstation stock | tgstation dmfast | Compiler groups | Runtime groups | Disabled | World load stock | World load dmfast | Verify mode | World output | Bug fixes | DM test suite |"
            echo "|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|"
            cat compat-*.md 2>/dev/null | sort -t'|' -k4,4 -k2,2V
          } | tee -a "$GITHUB_STEP_SUMMARY"

  # dmfast only, latest BYOND: tgstation boots MetaStation through Initializations complete and keeps running.
  boot:
    name: Boot tgstation (${{ matrix.os == 'windows-latest' && 'Windows' || 'Linux' }})
    needs: pack
    if: always() && (needs.pack.result == 'success' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository))
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      TG_COMMIT: 1568dbe1daeba67dc20939c6307d07522967e89c
      COMPAT_WORK: ${{ github.workspace }}/compat-work
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        if: needs.pack.result == 'success'
        with:
          name: dmfast-install
      - name: Installer from main's latest passing run (fork PR)
        if: needs.pack.result != 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh run list -R "$GITHUB_REPOSITORY" -w CI -b main -e push -s success -L 1 --json databaseId -q '.[0].databaseId')
          gh run download "$id" -R "$GITHUB_REPOSITORY" -n dmfast-install
      - name: Install 32-bit runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo apt-get install -y -qq libc6:i386 libstdc++6:i386 libgcc-s1:i386 zlib1g:i386 libssl-dev:i386 libcurl4:i386 unzip
      - uses: actions/cache@v6
        id: tg
        with:
          path: tgstation
          key: tgstation-${{ env.TG_COMMIT }}
      - name: Fetch tgstation
        if: steps.tg.outputs.cache-hit != 'true'
        shell: bash
        run: |
          git init -q tgstation
          git -C tgstation fetch -q --depth 1 https://github.com/tgstation/tgstation.git "$TG_COMMIT"
          git -C tgstation checkout -q FETCH_HEAD
          rm -rf tgstation/.git
      - name: rust_g version
        id: rustg
        if: runner.os == 'Linux'
        run: echo "version=$(sed -n 's/^export RUST_G_VERSION=//p' tgstation/dependencies.sh)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: rustg-cache
        if: runner.os == 'Linux'
        with:
          path: rust_g
          key: rust_g-${{ steps.rustg.outputs.version }}
      - name: Fetch rust_g
        if: runner.os == 'Linux'
        run: |
          if [ "${{ steps.rustg-cache.outputs.cache-hit }}" != true ]; then
            mkdir -p rust_g
            curl -sSfL --retry 4 -o rust_g/librust_g.so \
              "https://github.com/tgstation/rust-g/releases/download/${{ steps.rustg.outputs.version }}/librust_g.so"
          fi
      # The world writes data/ and logs into its folder: boot a copy, so the cached tgstation stays clean.
      - name: Copy tgstation
        shell: bash
        run: |
          cp -r tgstation tg-boot
          if [ "$RUNNER_OS" = Linux ]; then cp rust_g/librust_g.so tg-boot/; fi
      # tgstation ships dreamluau.dll but not libdreamluau.so; without it every Lua state is a runtime error.
      - name: Fetch dreamluau
        if: runner.os == 'Linux'
        run: |
          v=$(sed -n 's/^export DREAMLUAU_VERSION=//p' tgstation/dependencies.sh)
          curl -sSfL --retry 4 -o tg-boot/libdreamluau.so "https://github.com/tgstation/dreamluau/releases/download/$v/libdreamluau.so"
      - name: Install BYOND 516.latest and dmfast
        shell: bash
        run: COMPAT_PHASE=setup python3 tools/compat.py 516.latest dmfast-install.exe tg-boot/tgstation.dme
      - name: Boot MetaStation
        shell: bash
        run: python3 tools/boot.py "$COMPAT_WORK/fast/bin" tg-boot/tgstation.dme

  # One check to require before merging: fails if any job above failed or was cancelled.
  result:
    name: CI result
    needs: [windows, linux, pack, scan, compat, boot]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check jobs
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
