# v* tag: run CI, then attest and publish the installer.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    secrets: inherit
    permissions:
      contents: read
      issues: write

  publish:
    name: Publish
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dmfast-install
      - uses: actions/download-artifact@v8
        with:
          pattern: compat-*
          merge-multiple: true
          path: compat
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dmfast-install.exe
      - name: Write release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash tools/release-notes.sh compat > notes.md
          echo >> notes.md
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$GITHUB_REF_NAME" --jq .body >> notes.md
          cat notes.md
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dmfast-install.exe --repo "$GITHUB_REPOSITORY" --title "dmfast ${GITHUB_REF_NAME#v}" --notes-file notes.md
