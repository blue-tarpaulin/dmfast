# Builds the combined Windows + Linux installer, tests it against a spread of BYOND
# builds and scans it with Windows Defender.
# Pushes to main and manual runs keep it as a workflow artifact, so the full compat matrix is green before a
# tag is cut; pushing a `v*` tag also attests its build provenance and publishes it as a GitHub release (only
# if the scan is clean).
#
# The patches/ submodule is fetched by .github/actions/patches with a read-only deploy key (secret DMFAST_PATCHES_KEY).
name: release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/patches
        with:
          key: ${{ secrets.DMFAST_PATCHES_KEY }}
      - name: Add Rust target
        shell: bash
        run: rustup target add i686-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - name: Build
        shell: bash
        run: cargo build --release --locked -p dmfast-install
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: target/release/dmfast-install.exe
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    # Debian 12: BYOND 516 needs glibc 2.34; the installer's build script checks libdmfast.so needs no newer symbols.
    container: debian:12
    steps:
      - name: Install build tools
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends git openssh-client ca-certificates curl build-essential gcc-multilib
      - uses: actions/checkout@v7
      - uses: ./.github/actions/patches
        with:
          key: ${{ secrets.DMFAST_PATCHES_KEY }}
      - uses: ./.github/actions/rust-linux
      - uses: Swatinem/rust-cache@v2
      - name: Build
        shell: bash
        run: |
          cargo build --release --locked -p dmfast-install
          cp target/release/dmfast-install dmfast-install-linux
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: dmfast-install-linux
          if-no-files-found: error

  pack:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/patches
        with:
          key: ${{ secrets.DMFAST_PATCHES_KEY }}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v8
        with:
          path: parts
      - name: Pack
        run: |
          mkdir -p dist
          cargo run -q --release --locked -p dmfast-pack -- parts/windows/dmfast-install.exe parts/linux/dmfast-install-linux dist/dmfast-install.exe
          sha256sum dist/dmfast-install.exe
      - uses: actions/upload-artifact@v7
        with:
          name: dmfast-install
          path: dist/dmfast-install.exe
          if-no-files-found: error

  # The packed installer against a spread of BYOND builds from byond-builds.dm-lang.org, on both OSes:
  # each must install, compile tgstation and tests/testworld.dme to the same .dmb as stock, run testworld the
  # same in DreamDaemon, and print the same from tgstation's world for 10 s after it loads. Patches that don't
  # match a build disable themselves; the report lists which.
  compat:
    needs: pack
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        # At most 9 builds
        byond: ["515.1647", "516.1648", "516.1667", "516.1670", "516.1675", "516.1680", "516.1684", "516.1688", "516.latest"]
    runs-on: ${{ matrix.os }}
    env:
      TG_COMMIT: 1568dbe1daeba67dc20939c6307d07522967e89c
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dmfast-install
      - name: Install 32-bit runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo apt-get install -y -qq libc6:i386 libstdc++6:i386 libgcc-s1:i386 zlib1g:i386 libssl-dev:i386 libcurl4:i386 unzip
      - uses: actions/cache@v6
        id: tg
        with:
          path: tgstation
          key: tgstation-${{ env.TG_COMMIT }}
      - name: Fetch tgstation
        if: steps.tg.outputs.cache-hit != 'true'
        shell: bash
        run: |
          git init -q tgstation
          git -C tgstation fetch -q --depth 1 https://github.com/tgstation/tgstation.git "$TG_COMMIT"
          git -C tgstation checkout -q FETCH_HEAD
          rm -rf tgstation/.git
      # tgstation's own Windows rust_g.dll is in the repository; on Linux its CI downloads the release's
      # librust_g.so, so do the same (cached: it is ~100 MB). Without it the world fails every rust_g call.
      - name: rust_g version
        id: rustg
        if: runner.os == 'Linux'
        run: echo "version=$(sed -n 's/^export RUST_G_VERSION=//p' tgstation/dependencies.sh)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: rustg-cache
        if: runner.os == 'Linux'
        with:
          path: rust_g
          key: rust_g-${{ steps.rustg.outputs.version }}
      - name: Fetch rust_g
        if: runner.os == 'Linux'
        run: |
          if [ "${{ steps.rustg-cache.outputs.cache-hit }}" != true ]; then
            mkdir -p rust_g
            curl -sSfL --retry 4 -o rust_g/librust_g.so \
              "https://github.com/tgstation/rust-g/releases/download/${{ steps.rustg.outputs.version }}/librust_g.so"
          fi
          cp rust_g/librust_g.so tgstation/librust_g.so
          ldd tgstation/librust_g.so | grep 'not found' && exit 1 || true
      - name: Test
        shell: bash
        # Each BYOND program has its own time limit in compat.sh (a stock build that hangs is skipped as
        # broken). This catches anything else that hangs: past 20 minutes the build is skipped with a warning.
        run: |
          rc=0
          timeout 20m bash tools/compat.sh "${{ matrix.byond }}" dmfast-install.exe tgstation/tgstation.dme || rc=$?
          if [ "$rc" = 124 ]; then
            echo "::warning::BYOND ${{ matrix.byond }} on ${{ runner.os }}: test still running after 20 minutes; skipped"
            exit 0
          fi
          exit "$rc"
      - name: Keep rust_g out of the tgstation cache
        if: always() && runner.os == 'Linux'
        run: rm -f tgstation/librust_g.so
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: compat-${{ runner.os }}-${{ matrix.byond }}
          path: compat-*.md
          if-no-files-found: ignore

  compat-report:
    needs: compat
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: compat-*
          merge-multiple: true
      - name: Report
        run: |
          {
            echo "### BYOND compatibility"
            echo
            echo "| Requested | Build | OS | Result | tgstation stock | tgstation dmfast | Compiler groups | Runtime groups | Disabled | World load stock | World load dmfast | Verify mode | World output | Bug fixes |"
            echo "|---|---|---|---|---|---|---|---|---|---|---|---|---|---|"
            cat compat-*.md 2>/dev/null | sort -t'|' -k4,4 -k2,2V
          } | tee -a "$GITHUB_STEP_SUMMARY"

  # Windows Defender scan of the packed installer. A detection opens an issue (submit the file at
  # https://www.microsoft.com/wdsi/filesubmission; there is no API for that) and fails the run, so a
  # flagged installer is never released.
  scan:
    needs: pack
    runs-on: windows-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dmfast-install
      - name: Scan with Windows Defender
        id: scan
        shell: pwsh
        run: |
          $mp = "C:\Program Files\Windows Defender\MpCmdRun.exe"
          & $mp -SignatureUpdate | Out-Null
          $exe = (Resolve-Path dmfast-install.exe).Path
          $out = & $mp -Scan -ScanType 3 -File $exe -DisableRemediation 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $out
          $out | Out-File -FilePath defender_output.txt -Encoding utf8
          # MpCmdRun: 0 = clean, 2 = threat found, anything else = the scan itself failed.
          if ($code -eq 2) {
            Write-Host "::error::Windows Defender flagged dmfast-install.exe"
            "detection=true" >> $env:GITHUB_OUTPUT
          } elseif ($code -ne 0) {
            Write-Host "::error::Windows Defender scan failed (exit code $code)"
            exit 1
          } else {
            "detection=false" >> $env:GITHUB_OUTPUT
          }
      - name: Open an issue for the detection
        if: steps.scan.outputs.detection == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Windows Defender flagged dmfast-install.exe (${GITHUB_REF_NAME})" \
            --body "$(printf 'Windows Defender flagged the installer built by %s (ref `%s`, sha256 `%s`).\n\nSubmit it as a false positive (software developer) at https://www.microsoft.com/wdsi/filesubmission; it is attached to the run as the `dmfast-install` artifact.\n\n```\n%s\n```\n' "$RUN_URL" "$GITHUB_REF_NAME" "$(sha256sum dmfast-install.exe | cut -d' ' -f1)" "$(cat defender_output.txt)")"
          exit 1

  release:
    needs: [scan, compat]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dmfast-install
      - uses: actions/download-artifact@v8
        with:
          pattern: compat-*
          merge-multiple: true
          path: compat
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dmfast-install.exe
      - name: Write release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash tools/release-notes.sh compat > notes.md
          echo >> notes.md
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$GITHUB_REF_NAME" --jq .body >> notes.md
          cat notes.md
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dmfast-install.exe --repo "$GITHUB_REPOSITORY" --title "dmfast ${GITHUB_REF_NAME#v}" --notes-file notes.md
