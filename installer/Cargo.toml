[package]
name = "dmfast-install"
version.workspace = true
edition = "2024"

[dependencies]
object = { version = "0.40.0", default-features = false, features = ["read_core", "pe", "elf", "std"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_UI_Shell", "Win32_Foundation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_System_Registry", "Win32_System_Console"] }

[build-dependencies]
object = { version = "0.40.0", default-features = false, features = ["read_core", "elf", "std"] }
winresource = "0.1.31"
